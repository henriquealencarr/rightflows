<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="l1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0" />
      <stop offset="65%" stop-color="#fff" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#fff" stop-opacity="0.4" />
    </linearGradient>
    <linearGradient id="l2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0" />
      <stop offset="65%" stop-color="#fff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#fff" stop-opacity="0.28" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g stroke-linecap="round" filter="url(#glow)">
    <!-- Evenly spaced diagonal segments, 45°, grid across the canvas -->
    <line x1="-140" y1="-40" x2="140" y2="-320" stroke="url(#l2)" stroke-width="1.5" />
    <circle cx="140" cy="-320" r="2" fill="#fff" fill-opacity="0.4" />

    <line x1="260" y1="-40" x2="540" y2="-320" stroke="url(#l1)" stroke-width="2" />
    <circle cx="540" cy="-320" r="2.4" fill="#fff" fill-opacity="0.5" />

    <line x1="660" y1="-40" x2="940" y2="-320" stroke="url(#l2)" stroke-width="1.5" />
    <circle cx="940" cy="-320" r="2" fill="#fff" fill-opacity="0.4" />

    <line x1="60" y1="220" x2="340" y2="-60" stroke="url(#l1)" stroke-width="2" />
    <circle cx="340" cy="-60" r="2.4" fill="#fff" fill-opacity="0.5" />

    <line x1="460" y1="220" x2="740" y2="-60" stroke="url(#l2)" stroke-width="1.5" />
    <circle cx="740" cy="-60" r="2" fill="#fff" fill-opacity="0.4" />

    <line x1="-140" y1="480" x2="140" y2="200" stroke="url(#l1)" stroke-width="2" />
    <circle cx="140" cy="200" r="2.4" fill="#fff" fill-opacity="0.5" />

    <line x1="260" y1="480" x2="540" y2="200" stroke="url(#l2)" stroke-width="1.5" />
    <circle cx="540" cy="200" r="2" fill="#fff" fill-opacity="0.4" />

    <line x1="660" y1="480" x2="940" y2="200" stroke="url(#l1)" stroke-width="2" />
    <circle cx="940" cy="200" r="2.4" fill="#fff" fill-opacity="0.5" />

    <line x1="60" y1="740" x2="340" y2="460" stroke="url(#l2)" stroke-width="1.5" />
    <circle cx="340" cy="460" r="2" fill="#fff" fill-opacity="0.4" />

    <line x1="460" y1="740" x2="740" y2="460" stroke="url(#l1)" stroke-width="2" />
    <circle cx="740" cy="460" r="2.4" fill="#fff" fill-opacity="0.5" />

    <line x1="-140" y1="1000" x2="140" y2="720" stroke="url(#l2)" stroke-width="1.5" />
    <circle cx="140" cy="720" r="2" fill="#fff" fill-opacity="0.4" />

    <line x1="260" y1="1000" x2="540" y2="720" stroke="url(#l1)" stroke-width="2" />
    <circle cx="540" cy="720" r="2.4" fill="#fff" fill-opacity="0.5" />

    <line x1="660" y1="1000" x2="940" y2="720" stroke="url(#l2)" stroke-width="1.5" />
    <circle cx="940" cy="720" r="2" fill="#fff" fill-opacity="0.4" />

    <line x1="60" y1="1260" x2="340" y2="980" stroke="url(#l1)" stroke-width="2" />
    <circle cx="340" cy="980" r="2.4" fill="#fff" fill-opacity="0.5" />

    <line x1="460" y1="1260" x2="740" y2="980" stroke="url(#l2)" stroke-width="1.5" />
    <circle cx="740" cy="980" r="2" fill="#fff" fill-opacity="0.4" />

    <line x1="-140" y1="1440" x2="140" y2="1160" stroke="url(#l1)" stroke-width="2" />
    <circle cx="140" cy="1160" r="2.4" fill="#fff" fill-opacity="0.5" />

    <line x1="260" y1="1440" x2="540" y2="1160" stroke="url(#l2)" stroke-width="1.5" />
    <circle cx="540" cy="1160" r="2" fill="#fff" fill-opacity="0.4" />

    <line x1="660" y1="1440" x2="940" y2="1160" stroke="url(#l1)" stroke-width="2" />
    <circle cx="940" cy="1160" r="2.4" fill="#fff" fill-opacity="0.5" />

    <line x1="160" y1="-260" x2="440" y2="-540" stroke="url(#l2)" stroke-width="1.5" />
    <circle cx="440" cy="-540" r="2" fill="#fff" fill-opacity="0.4" />

    <line x1="560" y1="-260" x2="840" y2="-540" stroke="url(#l1)" stroke-width="2" />
    <circle cx="840" cy="-540" r="2.4" fill="#fff" fill-opacity="0.5" />

    <line x1="60" y1="1660" x2="340" y2="1380" stroke="url(#l2)" stroke-width="1.5" />
    <circle cx="340" cy="1380" r="2" fill="#fff" fill-opacity="0.4" />

    <line x1="460" y1="1660" x2="740" y2="1380" stroke="url(#l1)" stroke-width="2" />
    <circle cx="740" cy="1380" r="2.4" fill="#fff" fill-opacity="0.5" />

    <line x1="-140" y1="-500" x2="140" y2="-780" stroke="url(#l1)" stroke-width="2" />
    <circle cx="140" cy="-780" r="2.4" fill="#fff" fill-opacity="0.5" />

    <line x1="260" y1="-500" x2="540" y2="-780" stroke="url(#l2)" stroke-width="1.5" />
    <circle cx="540" cy="-780" r="2" fill="#fff" fill-opacity="0.4" />

    <line x1="660" y1="-500" x2="940" y2="-780" stroke="url(#l1)" stroke-width="2" />
    <circle cx="940" cy="-780" r="2.4" fill="#fff" fill-opacity="0.5" />
  </g>
</svg>
